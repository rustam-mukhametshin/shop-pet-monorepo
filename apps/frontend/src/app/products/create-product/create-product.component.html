<div class="mb-4">
  <h1 class="h3 mb-1">Create product</h1>
  <p class="text-muted mb-0">Fill in product details and save.</p>
</div>

<button
  class="mb-3"
  mat-button="tonal"
  type="button"
  [disabled]="isGeneratingDescription"
  (click)="generateDescription(productForm)"
>
  {{ isGeneratingDescription ? 'Generating...' : 'Generate description' }}
</button>

<app-form-product
  #productForm
  submitLabel="Create product"
  (formSubmit)="createProduct($event)"
></app-form-product>
